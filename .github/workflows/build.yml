name: Build EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find and build project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter MultiPointAutoClicker.csproj -Recurse | Select-Object -First 1
          if (-not $project) {
            throw "Project file not found"
          }
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Save EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: publish/*.exe

